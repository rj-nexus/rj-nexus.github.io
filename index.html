<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">RJ Nexus Documentation</title>
    <style>
        :root { --bg: #0a0a0f; --surface: #14141c; --border: #262632; --text: #e5e7eb; --muted: #94a3b8; --primary: #a78bfa; --secondary: #f472b6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; background-image: radial-gradient(circle at top, rgba(167, 139, 250, 0.15), transparent 50%); }
        .hero { max-width: 800px; }
        h1 { font-size: 56px; font-weight: 800; margin-bottom: 24px; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.03em; }
        p { font-size: 18px; line-height: 1.6; color: var(--muted); margin-bottom: 40px; }
        .btn { display: inline-block; padding: 16px 32px; font-size: 16px; font-weight: 700; color: #fff; text-decoration: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 8px 25px -8px var(--primary); transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .lang-switch { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .lang-switch button { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .lang-switch button:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button onclick="loadLanguage('en')">EN</button>
        <button onclick="loadLanguage('az')">AZ</button>
    </div>
    <div class="hero">
        <h1 data-i18n="hero_title">RJ Nexus Docs</h1>
        <p data-i18n="hero_desc">Everything you need to build, customize, and scale with RJ Nexus CMS.</p>
        <!-- DÜYMƏNİN LİNKİNƏ DİQQƏT EDİN: documentation/ qovluğuna yönləndirir -->
        <a href="./documentation/index.html" class="btn" data-i18n="btn_start">Read Documentation</a>
    </div>
    <script>
        async function loadLanguage(lang) {
            try {
                const response = await fetch(`./lang/${lang}.json`);
                const translations = await response.json();
                document.querySelectorAll('[data-i18n]').forEach(element => {
                    const key = element.getAttribute('data-i18n');
                    if (translations[key]) element.textContent = translations[key];
                });
            } catch (error) { console.error('Translation error:', error); }
        }
        loadLanguage('en');
    </script>
</body>
</html>
