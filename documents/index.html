<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ Nexus Documentation</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/rj-nexus/rj-nexus.github.io/main/assets/favicon/favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    
    <style>
        :root {
            --bg: #05050a;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --primary: #a78bfa;
            --secondary: #f472b6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh; display: flex; overflow-x: hidden; position: relative;
        }

        .bg-orb {
            position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.5;
            animation: float 10s infinite alternate; pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(167, 139, 250, 0.3); top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(244, 114, 182, 0.2); bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

        .sidebar {
            width: 320px; background: var(--surface); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border); padding: 32px 24px;
            position: fixed; height: 100vh; overflow-y: auto; z-index: 10;
        }
        
        .home-link {
            display: inline-flex; align-items: center; gap: 8px; color: var(--muted);
            text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 24px;
            transition: color 0.2s;
        }
        .home-link:hover { color: var(--primary); }
        
        .sidebar h2 {
            font-size: 22px; font-weight: 800; margin-bottom: 20px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .search-container { margin-bottom: 24px; position: relative; }
        .search-input {
            width: 100%; padding: 12px 16px 12px 40px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: all 0.3s;
        }
        .search-input:focus { border-color: var(--primary); background: rgba(255,255,255,0.08); box-shadow: 0 0 15px -5px var(--primary); }
        .search-icon { position: absolute; left: 14px; top: 13px; width: 16px; height: 16px; color: var(--muted); }
        
        .menu-list { list-style: none; }
        .menu-list li { margin-bottom: 8px; }
        .menu-list a {
            color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 500;
            display: block; padding: 12px 16px; border-radius: 12px; transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .menu-list a:hover { color: var(--text); background: rgba(255,255,255,0.03); }
        .menu-list a.active {
            color: var(--primary); background: rgba(167, 139, 250, 0.1); 
            border-color: rgba(167, 139, 250, 0.2); border-left: 3px solid var(--primary); font-weight: 600;
        }

        #search-results { display: none; list-style: none; }
        #search-results a { 
            display: block; padding: 12px 16px; border-radius: 12px; color: var(--text); 
            text-decoration: none; background: rgba(255,255,255,0.02); margin-bottom: 8px; 
            border: 1px solid var(--border); font-size: 14px; transition: 0.2s; 
        }
        #search-results a:hover { background: rgba(167, 139, 250, 0.1); border-color: var(--primary); }
        #search-results strong { display: block; color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        #search-results span { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
        #search-results mark { background: rgba(167,139,250,0.3); color: #fff; padding: 0 2px; border-radius: 3px; }
        .no-results { color: var(--muted); font-size: 14px; padding: 10px; font-style: italic; }

        .main-content {
            margin-left: 320px; padding: 60px 80px; flex-grow: 1; max-width: 1000px;
            position: relative; z-index: 1;
        }
        
        .content-card {
            background: var(--surface); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px; padding: 48px;
            box-shadow: 0 30px 60px -30px rgba(0,0,0,0.8); min-height: 80vh;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .markdown-body h1 { font-size: 40px; font-weight: 800; margin-bottom: 24px; color: #fff; letter-spacing: -0.02em; }
        .markdown-body h2 { font-size: 28px; font-weight: 700; margin: 40px 0 20px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .markdown-body h3 { font-size: 22px; font-weight: 600; margin: 32px 0 16px; color: #fff; }
        .markdown-body p { font-size: 16px; line-height: 1.8; color: var(--muted); margin-bottom: 20px; }
        .markdown-body a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body ul, .markdown-body ol { padding-left: 24px; margin-bottom: 20px; color: var(--muted); line-height: 1.8; }
        .markdown-body li { margin-bottom: 10px; }
        .markdown-body code { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; font-family: 'Fira Code', monospace; color: var(--secondary); font-size: 14px; }
        .markdown-body pre { background: rgba(0,0,0,0.4); padding: 24px; border-radius: 16px; overflow-x: auto; border: 1px solid var(--border); margin-bottom: 24px; }
        .markdown-body pre code { background: transparent; padding: 0; color: #e5e7eb; font-size: 14px; }
        
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); padding: 24px; }
            .main-content { margin-left: 0; padding: 30px 20px; }
            .content-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="sidebar">
        <a href="../index.html" class="home-link">
            <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Home
        </a>
        <h2>Documentation</h2>

        <div class="search-container">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search docs (typo tolerant)..." autocomplete="off">
        </div>
        
        <ul class="menu-list" id="menu-container">
            <li><span style="color:var(--muted); font-size:14px;">Loading menu...</span></li>
        </ul>

        <ul id="search-results"></ul>
    </div>

    <div class="main-content">
        <div class="content-card markdown-body" id="content-area">
            <p>Loading content...</p>
        </div>
    </div>

    <script>
        let searchData = []; 
        let fuse = null;

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function highlightText(text, query) {
            if (!text) return '';
            let escaped = escapeHtml(text);
            if (!query) return escaped;
            
            const tokens = query.toLowerCase().split(/\s+/).filter(t => t.length >= 2);
            if (tokens.length === 0) return escaped;

            tokens.forEach(tok => {
                const re = new RegExp('(' + tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                escaped = escaped.replace(re, '<mark>$1</mark>');
            });
            return escaped;
        }

        async function init() {
            try {
                const menuResponse = await fetch('./menu.json');
                if (menuResponse.ok) {
                    const menuItems = await menuResponse.json();
                    renderMenu(menuItems);
                    
                    const currentHash = window.location.hash.replace('#', '') || (menuItems.length > 0 ? menuItems[0].slug : 'getting-started');
                    loadContent(currentHash);
                } else {
                    document.getElementById('menu-container').innerHTML = '<li style="color:#ef4444;">Error loading menu.json</li>';
                }

                const searchResponse = await fetch('./documentation/search.json');
                if (searchResponse.ok) {
                    searchData = await searchResponse.json();
                    
                    if (searchData.length > 0 && typeof Fuse !== 'undefined') {
                        var searchKeys = [
                            { name: 'title', weight: 3 },
                            { name: 'content', weight: 1 }
                        ];
                        
                        if (searchData[0] && 'headings' in searchData[0]) {
                            searchKeys.splice(1, 0, { name: 'headings', weight: 2 });
                        }

                        fuse = new Fuse(searchData, {
                            keys: searchKeys,
                            threshold: 0.6,
                            distance: 1000,
                            ignoreLocation: true,
                            includeScore: true,
                            includeMatches: true,
                            minMatchCharLength: 2,
                            shouldSort: true,
                            findAllMatches: true
                        });
                    }
                }
            } catch (error) {
                console.error('Init error:', error);
            }
        }

        function renderMenu(menuItems) {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = '';

            menuItems.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${item.slug}`;
                a.textContent = item.title;
                a.setAttribute('data-slug', item.slug);
                
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.hash = item.slug;
                    document.getElementById('search-input').value = '';
                    resetSearch();
                });

                li.appendChild(a);
                menuContainer.appendChild(li);
            });
        }

        document.getElementById('search-input').addEventListener('input', function(e) {
            const query = e.target.value.trim();
            const menuContainer = document.getElementById('menu-container');
            const searchResults = document.getElementById('search-results');

            if (query.length === 0) { resetSearch(); return; }

            if (!fuse) {
                menuContainer.style.display = 'none';
                searchResults.style.display = 'block';
                searchResults.innerHTML = `<li class="no-results">Search index is not ready.</li>`;
                return;
            }

            const results = fuse.search(query).slice(0, 8);

            menuContainer.style.display = 'none';
            searchResults.style.display = 'block';
            searchResults.innerHTML = '';

            if (results.length > 0) {
                results.forEach(res => {
                    const item = res.item;
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `#${item.slug}`;
                    
                    const titleHtml = highlightText(item.title, query);
                    const snippetText = item.excerpt || (item.content || '').substring(0, 120) + '...';
                    const snippetHtml = highlightText(snippetText, query);

                    a.innerHTML = `<strong>${titleHtml}</strong><span>${snippetHtml}</span>`;
                    
                    a.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        window.location.hash = item.slug;
                        document.getElementById('search-input').value = '';
                        resetSearch();
                    });
                    li.appendChild(a);
                    searchResults.appendChild(li);
                });
            } else {
                searchResults.innerHTML = `<li class="no-results">No results found for "${query}"</li>`;
            }
        });

        function resetSearch() {
            document.getElementById('menu-container').style.display = 'block';
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('search-results').innerHTML = '';
        }

        async function loadContent(slug) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<p style="color:var(--primary);">Loading document...</p>';

            document.querySelectorAll('.menu-list a').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-slug') === slug) link.classList.add('active');
            });

            try {
                const response = await fetch(`./documentation/content/${slug}.md`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const markdownText = await response.text();
                contentArea.innerHTML = marked.parse(markdownText);

            } catch (error) {
                console.error('Məzmun yüklənmədi:', error);
                contentArea.innerHTML = `
                    <h1 style="color: #ef4444; font-size: 32px;">404 - Document Not Found</h1>
                    <p style="color: var(--muted);">The system tried to load: <br><code>./documentation/content/${slug}.md</code></p>
                `;
            }
        }

        window.addEventListener('hashchange', () => {
            const slug = window.location.hash.replace('#', '');
            if (slug) loadContent(slug);
        });

        init();
    </script>
</body>
</html>
