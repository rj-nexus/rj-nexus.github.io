name: Auto Generate Search JSON

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/content/**/*.md' # Yalnız .md faylları dəyişəndə işə düşür
  workflow_dispatch: # İstəsəniz əl ilə də işə sala biləsiniz deyə bu düyməni əlavə etdik

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # Sizin yaratdığınız xüsusi açar
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Search Generator Script
        run: node generate-search.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add documentation/search.json
          git commit -m "docs: auto-update search.json" || echo "No changes to commit"
          git push
