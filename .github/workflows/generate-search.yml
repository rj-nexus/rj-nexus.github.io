name: Auto Generate Search JSON

on:
  push:
    branches:
      - main
    paths:
      - 'documents/documentation/content/**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug Folder Structure
        run: |
          echo "Cari qovluq:"
          pwd
          echo "Fayllar siyahısı:"
          ls -R

      - name: Run Search Generator Script
        run: node documents/generate-search.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # BÜTÜN dəyişiklikləri əlavə edirik ki, yol xətası olmasın
          git add -A
          git commit -m "docs: auto-update search.json" || echo "No changes to commit"
          git push
