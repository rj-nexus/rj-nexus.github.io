name: Auto Generate Search JSON

on:
  push:
    branches:
      - main
    paths:
      - 'documents/documentation/content/**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Search Generator Script
        # DÜZƏLİŞ 1: Skriptin yolunu qeyd etdik
        run: node documents/generate-search.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # DÜZƏLİŞ 2: Faylın tam yolunu qeyd etdik
          git add documents/documentation/search.json
          git commit -m "docs: auto-update search.json" || echo "No changes to commit"
          git push
